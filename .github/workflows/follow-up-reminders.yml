name: Follow-up reminders

on:
  schedule:
    # GitHub's nominal hourly schedule has shown multi-hour gaps. Share the
    # daytime wake cadence with Gmail and health; stay hourly overnight.
    - cron: "5,20,35,50 12-23 * * *"
    - cron: "5 0-11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger reminder sweep
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 25 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://musiccityspecialtywelding.com/api/ops/reminders")
          body=$(printf '%s' "$response" | sed '$d')
          status=$(printf '%s' "$response" | tail -n 1)
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Reminder sweep failed with HTTP $status"
            exit 1
          fi
          if ! printf '%s' "$body" | jq -e '.ok == true' >/dev/null; then
            echo "::error::Reminder sweep returned an unhealthy result"
            exit 1
          fi
