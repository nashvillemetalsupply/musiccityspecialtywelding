name: The Works Gmail sync

on:
  schedule:
    # Vercel Hobby is daily-only; this carries the money/RFQ loop.
    #
    # Every 15 minutes 12:00-23:59 UTC (7am-6pm Central), hourly overnight.
    # Minutes are aligned with health-monitor and follow-up-reminders so one Neon
    # compute wake serves all three. Neon free-plan compute suspends after 5 idle
    # minutes and 0.25 CU awake 24/7 would be 182 CU-hours/month against a 100
    # CU-hour allowance. This shape is ~40.
    #
    # Measured 2026-08-18: this project was at 38.59/100, never close to the wall,
    # because GitHub throttles scheduled runs and the old */5 really fired every
    # 20-40 minutes. The alignment is still worth having; the urgency was not.
    - cron: "5,20,35,50 12-23 * * *"
    - cron: "5 0-11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: the-works-gmail-sync
  cancel-in-progress: false

jobs:
  sync-gmail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pull new Gmail receipts
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 90 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://musiccityspecialtywelding.com/api/ingest/gmail")
          status=$(printf '%s' "$response" | tail -n 1)
          body=$(printf '%s' "$response" | sed '$d')
          echo "HTTP $status"
          # A 202 is the ingest route's truthful "another leased sync already
          # owns this checkpoint" response. Opportunistic production wakes can
          # now overlap this job, so that safe coalescing is success, not noise.
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "::error::Gmail sync failed with HTTP $status"
            exit 1
          fi
          if ! printf '%s' "$body" | jq -e '.ok == true' >/dev/null; then
            echo "::error::Gmail sync returned ok=false"
            exit 1
          fi

      - name: Verify Shop Brain after ingest
        run: |
          set -euo pipefail
          body=$(curl -sS --fail-with-body --max-time 30 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://musiccityspecialtywelding.com/api/health")
          diagnostic=$(printf '%s' "$body" | jq -c '{
            ok,
            leadsAccepted,
            delivery,
            automation: {
              lastGmailOk: .automation.lastGmailOk,
              gmailStale: .automation.gmailStale
            },
            shopBrain: {
              ready: .shopBrain.ready,
              durableFailures: .shopBrain.durableFailures,
              callTranscriptBacklog: .shopBrain.callTranscriptBacklog,
              voiceTranscriptBacklog: .shopBrain.voiceTranscriptBacklog,
              uploadRecoveryBacklog: .shopBrain.uploadRecoveryBacklog,
              quotePhotoBacklog: .shopBrain.quotePhotoBacklog
            }
          }')
          echo "Health diagnostic: $diagnostic"
          if ! printf '%s' "$body" | jq -e '.ok == true and .leadsAccepted == true and .shopBrain.ready == true and .shopBrain.durableFailures.healthy == true' >/dev/null; then
            echo "::error::Post-ingest Shop Brain health is degraded"
            exit 1
          fi
