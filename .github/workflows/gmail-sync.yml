name: The Works Gmail sync

on:
  schedule:
    # Vercel Hobby is daily-only; this preserves the five-minute money/RFQ loop.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: the-works-gmail-sync
  cancel-in-progress: false

jobs:
  sync-gmail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pull new Gmail receipts
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 90 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://musiccityspecialtywelding.com/api/ingest/gmail")
          status=$(printf '%s' "$response" | tail -n 1)
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Gmail sync failed with HTTP $status"
            exit 1
          fi
