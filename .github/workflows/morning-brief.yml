name: The Works morning Radio

on:
  schedule:
    # 6:30 America/Chicago in CDT and CST. The route's Central-day claim is idempotent.
    - cron: "30 11,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cut-radio-tape:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Cut or resume the morning tape
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 90 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://musiccityspecialtywelding.com/api/ops/brief")
          status=$(printf '%s' "$response" | tail -n 1)
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Morning Radio failed with HTTP $status"
            exit 1
          fi
