name: Production health monitor

on:
  schedule:
    # GitHub may delay scheduled runs under load.
    #
    # Same minutes as gmail-sync so both share one Neon compute wake instead of
    # each paying its own. Offsetting them would double the wakes for no benefit.
    # See gmail-sync.yml for the CU-hour arithmetic.
    - cron: "5,20,35,50 12-23 * * *"
    - cron: "5 0-11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Needed only by the Ads tag probe below; the curl checks are standalone.
      - uses: actions/checkout@v4

      - name: Check /api/health
        run: |
          set -euo pipefail
          response=$(curl -sS --max-time 20 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://musiccityspecialtywelding.com/api/health")
          body=$(printf '%s' "$response" | sed '$d')
          status=$(printf '%s' "$response" | tail -n 1)
          echo "HTTP $status"
          diagnostic=$(printf '%s' "$body" | jq -c '{
            ok,
            leadsAccepted,
            delivery,
            automation: {
              lastDigestOk: .automation.lastDigestOk,
              lastReminderOk: .automation.lastReminderOk,
              lastGmailOk: .automation.lastGmailOk,
              lastBriefOk: .automation.lastBriefOk,
              reminderStale: .automation.reminderStale,
              digestStale: .automation.digestStale,
              gmailStale: .automation.gmailStale,
              morningBriefStale: .automation.morningBriefStale
            },
            googleAds: {
              conversionConfigured: .googleAds.conversionConfigured,
              conversionSendTo: .googleAds.conversionSendTo,
              phoneConversionConfigured: .googleAds.phoneConversionConfigured,
              phoneConversionSendTo: .googleAds.phoneConversionSendTo,
              lastWebQuoteAt: .googleAds.lastWebQuoteAt,
              webQuoteSilenceHours: .googleAds.webQuoteSilenceHours,
              webQuoteSilent: .googleAds.webQuoteSilent
            },
            googleAnalytics: .googleAnalytics,
            shopBrain: {
              ready: .shopBrain.ready,
              gateSatisfied: .shopBrain.gateSatisfied,
              uploadRecoveryBacklog: .shopBrain.uploadRecoveryBacklog,
              quotePhotoBacklog: .shopBrain.quotePhotoBacklog,
              callTranscriptBacklog: .shopBrain.callTranscriptBacklog,
              callTranscriptExhausted: .shopBrain.callTranscriptExhausted,
              voiceTranscriptBacklog: .shopBrain.voiceTranscriptBacklog,
              inboundCallReceipts: .shopBrain.inboundCallReceipts,
              durableFailures: .shopBrain.durableFailures
            }
          }' 2>/dev/null || printf '%s' '{"diagnostic":"invalid-health-json"}')
          echo "Health diagnostic: $diagnostic"
          if [ "$status" != "200" ]; then
            echo "::error::Health endpoint returned HTTP $status"
            exit 1
          fi
          if ! printf '%s' "$body" | jq -e '.ok == true and .leadsAccepted == true and .shopBrain.ready == true and .shopBrain.durableFailures.healthy == true and .googleAds.conversionConfigured == true and .googleAds.phoneConversionConfigured == true and .googleAnalytics.measurementConfigured == true' >/dev/null; then
            echo "::error::Launch gate, measurement wiring, Shop Brain readiness, or durable delivery health is failing"
            exit 1
          fi
          # Google Ads conversion tracking went dead for eleven days from
          # 2026-08-24 and nothing here noticed, because every check watched
          # configuration and none watched the outcome. The outcome still gets
          # watched -- but the form takes about one lead a week, so form silence
          # is a warning at ten days, not a red build at four. A monitor that is
          # red at the healthy rate is a monitor nobody reads, and this one was
          # failing ten runs straight before the severities were swapped.
          if printf '%s' "$body" | jq -e '.googleAds.webQuoteSilent == true' >/dev/null; then
            hours=$(printf '%s' "$body" | jq -r '.googleAds.webQuoteSilenceHours // "never"')
            limit=$(printf '%s' "$body" | jq -r '.googleAds.webQuoteSilenceLimitHours')
            echo "::warning::No web quote has reached the database in ${hours} hours (limit ${limit}); check GA4 form_start against leads before assuming a dead tag"
          fi
          # The phone is the channel -- about twenty inbound calls a week, all of
          # them through the Twilio webhook -- so two days of receipt silence is
          # the signal worth a red build. This is a Shop Brain database-receipt
          # watchdog, not Twilio call-log truth: compare the provider call log
          # before diagnosing the cause.
          if printf '%s' "$body" | jq -e '.shopBrain.inboundCallReceipts.silent == true' >/dev/null; then
            hours=$(printf '%s' "$body" | jq -r '.shopBrain.inboundCallReceipts.silenceHours // "never"')
            limit=$(printf '%s' "$body" | jq -r '.shopBrain.inboundCallReceipts.silenceLimitHours')
            echo "::error::No non-test inbound call receipt reached Shop Brain in ${hours} hours (limit ${limit}); compare Twilio call logs before diagnosing the cause"
            exit 1
          fi

      - name: Check the Google Ads conversion tag is on the live site
        run: node scripts/verify-ads-tag.mjs

      - name: Check homepage serves
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' \
            "https://musiccityspecialtywelding.com/")
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Homepage returned HTTP $status"
            exit 1
          fi
